[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motra"
version = "0.2.0.dev0"
description = "M2M and M2T Models Transformations framework for PyEcore"
readme = "README.rst"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Vincent Aranega", email = "vincent.aranega@gmail.com"}]
dependencies = ["pyecore", "Mako"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/pyecore/motra"

[project.optional-dependencies]
test = ["pytest>=9.0.3"]

[tool.setuptools.packages.find]
include = ["motra*"]

[tool.setuptools.package-data]
motra = ["metamodels/*.ecore"]
